<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}글빛 로컬 관리자{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: "Malgun Gothic", system-ui, sans-serif; color:#17212b; background:#f5f8fa; }
    * { box-sizing:border-box; } body { margin:0; } main { max-width:720px; margin:48px auto; padding:0 20px; }
    .card { background:#fff; border:1px solid #dce5ea; border-radius:16px; box-shadow:0 4px 18px rgba(16,42,67,.07); padding:28px; margin-bottom:18px; }
    h1 { margin:0 0 8px; font-size:24px; } h2 { margin:0 0 16px; font-size:18px; } p { line-height:1.65; color:#526273; }
    label { display:block; font-weight:700; font-size:14px; margin:16px 0 7px; }
    input { width:100%; height:44px; border:1px solid #b8c6cf; border-radius:9px; padding:0 12px; font-size:15px; }
    button { border:0; border-radius:9px; padding:11px 18px; background:#087f8c; color:#fff; font-weight:700; cursor:pointer; margin-top:18px; }
    button.secondary { background:#475569; } .alert { padding:12px 14px; border-radius:9px; background:#fff0f0; color:#a51d1d; margin:14px 0; }
    .ok { background:#ecf8f0; color:#176b3a; } .muted { font-size:13px; color:#6b7c8d; } code { word-break:break-all; }
    .row { display:flex; gap:10px; align-items:center; justify-content:space-between; } .status { font-weight:700; color:#087f8c; }
  </style>
</head>
<body><main>
  <div class="card"><h1>글빛 로컬 관리자</h1><p class="muted">이 화면은 서버 컴퓨터의 127.0.0.1:5001에서만 사용할 수 있습니다. 학교용 Quick Tunnel에는 노출되지 않습니다.</p></div>
  {% if not storage_available %}<div class="alert">Windows DPAPI CurrentUser 저장을 사용할 수 없어 비밀 관리 기능이 비활성화되었습니다. 약한 대체 암호화는 사용하지 않습니다.</div>{% endif %}
  {% block content %}{% endblock %}
</main></body></html>
