{% extends "local_admin/base.html" %}
{% block title %}관리자 최초 설정 · 글빛{% endblock %}
{% block content %}<form class="card" method="post">
  <h2>관리자 비밀번호 최초 설정</h2>
  <p>API 키를 관리할 때 사용할 로컬 관리자 비밀번호를 설정합니다. 평문은 저장하지 않고 Argon2id 해시만 저장합니다.</p>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="password">새 비밀번호</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required>
  <label for="passwordConfirm">새 비밀번호 확인</label><input id="passwordConfirm" name="passwordConfirm" type="password" minlength="12" autocomplete="new-password" required>
  <button type="submit" {% if not storage_available %}disabled{% endif %}>안전하게 설정</button>
</form>{% endblock %}
